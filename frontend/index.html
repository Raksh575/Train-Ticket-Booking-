<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RailBook - Train Ticket Booking</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">🚆 RailBook</div>
    <nav>
      <button class="nav-btn active" data-tab="search">Search Trains</button>
      <button class="nav-btn" data-tab="mybookings">My Bookings</button>
    </nav>
  </header>

  <main>
    <!-- SEARCH TAB -->
    <section id="search" class="tab active-tab">
      <div class="card search-card">
        <h2>Search Trains</h2>
        <form id="searchForm" class="search-form">
          <div class="form-group">
            <label>From</label>
            <input type="text" id="source" placeholder="e.g. Chennai" required />
          </div>
          <div class="form-group">
            <label>To</label>
            <input type="text" id="destination" placeholder="e.g. Bangalore" required />
          </div>
          <div class="form-group">
            <label>Date of Journey</label>
            <input type="date" id="journeyDate" required />
          </div>
          <button type="submit" class="btn primary">Search</button>
        </form>
      </div>

      <div id="resultsContainer" class="results-container"></div>
    </section>

    <!-- MY BOOKINGS TAB -->
    <section id="mybookings" class="tab">
      <div class="card">
        <h2>My Bookings</h2>
        <form id="lookupForm" class="lookup-form">
          <input type="email" id="lookupEmail" placeholder="Enter your email" required />
          <button type="submit" class="btn primary">View Bookings</button>
        </form>
      </div>
      <div id="bookingsContainer" class="results-container"></div>
    </section>
  </main>

  <!-- BOOKING MODAL -->
  <div id="bookingModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2>Book Ticket</h2>
      <p id="modalTrainInfo" class="train-info"></p>
      <form id="bookingForm">
        <input type="hidden" id="modalTrainId" />
        <div class="form-group">
          <label>Passenger Name</label>
          <input type="text" id="passengerName" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="passengerEmail" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Age</label>
            <input type="number" id="passengerAge" min="1" max="120" required />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select id="passengerGender" required>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Number of Seats</label>
          <input type="number" id="seatsBooked" min="1" max="6" value="1" required />
        </div>
        <div id="fareSummary" class="fare-summary"></div>
        <button type="submit" class="btn primary full-width">Confirm Booking</button>
      </form>
    </div>
  </div>

  <!-- CONFIRMATION MODAL -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" id="closeConfirmModal">&times;</span>
      <div class="confirm-icon">✅</div>
      <h2>Booking Confirmed!</h2>
      <div id="confirmDetails" class="confirm-details"></div>
      <button class="btn primary full-width" id="confirmOkBtn">Done</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
